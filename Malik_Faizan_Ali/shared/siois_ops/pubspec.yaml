name: siois_ops
description: >
  Shared Flutter package for the Trends High School SIOIS apps (Member 2 modules: homework, exams,
  fees, timetable, calendar, announcements & notifications, complaints) plus a temporary app shell
  (login, API client, navigation) that stands in for Member 1's shell until it is merged.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  intl: ">=0.19.0 <1.0.0"
  file_picker: ^8.1.2
  file_saver: 0.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
